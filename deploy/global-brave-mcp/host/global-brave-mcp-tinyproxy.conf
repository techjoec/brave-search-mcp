User tinyproxy
Group tinyproxy
Listen 127.0.0.1
Port 18888
Timeout 60
Allow 127.0.0.1
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/global-brave-mcp.filter"
FilterType ere
FilterCaseSensitive No
FilterURLs Off
ConnectPort 443
Syslog On
LogLevel Connect
PidFile "/run/global-brave-mcp-tinyproxy/tinyproxy.pid"
MaxClients 32
